<!doctype html>
<meta charset="utf-8" />
<title>Diel mock watch</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 16px; background: #1b1d21; color: #e8e8e8; font: 14px/1.4 system-ui, sans-serif; }
  #watch { width: 384px; height: 384px; border-radius: 50%; background: #000; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 34px 54px; box-sizing: border-box; text-align: center; }
  #orb { width: 84px; height: 84px; border-radius: 50%; flex: none; transition: background .3s; background: #444; }
  #orb.idle { background: #4c8dff; }
  #orb.working { background: #37c98b; animation: pulse 1s ease-in-out infinite; }
  #orb.needs-you { background: #ffb020; animation: pulse .5s ease-in-out infinite; }
  #orb.error { background: #ff5a4f; }
  @keyframes pulse { 50% { transform: scale(.86); } }
  #title { margin-top: 8px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  #activity { color: #9aa; font-size: 12px; min-height: 17px; }
  #message { margin-top: 6px; font-size: 13px; overflow: auto; flex: 1; }
  #approval { display: none; gap: 8px; margin-top: 6px; }
  button { font: inherit; border: 0; border-radius: 16px; padding: 6px 14px; background: #2c3038; color: #fff; cursor: pointer; }
  form { display: flex; gap: 8px; width: 384px; }
  input, select { flex: 1; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid #3a3f48; background: #121316; color: #fff; }
  #log { width: 384px; color: #889; font-size: 12px; min-height: 18px; }
</style>
<div id="watch">
  <div id="orb"></div>
  <div id="title">connecting…</div>
  <div id="activity"></div>
  <div id="message"></div>
  <div id="approval"><button data-cmd="approve">Approve</button><button data-cmd="deny">Deny</button></div>
</div>
<form id="say"><input id="text" placeholder="Say something to the agent" autocomplete="off" /><button>Send</button></form>
<form><select id="threads"></select><button type="button" data-cmd="newThread">New</button><button type="button" data-cmd="stop">Stop</button></form>
<div id="log"></div>
<script>
  const $ = (id) => document.getElementById(id);
  let ws;
  function connect() {
    ws = new WebSocket(`ws://${location.host}/watch`);
    ws.onopen = () => ws.send(JSON.stringify({ type: "hello", token: "__DIEL_TOKEN__" }));
    ws.onclose = () => { render({ status: "offline", notice: "bridge disconnected", threads: [] }); setTimeout(connect, 1500); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === "state") render(m);
      if (m.type === "ack") $("log").textContent = `${m.for}: ${m.ok ? "ok" : "failed"} ${m.detail || ""}`;
    };
  }
  function render(s) {
    $("orb").className = s.status;
    $("title").textContent = s.thread ? s.thread.title : s.status === "offline" ? "Offline" : "No thread";
    $("activity").textContent = s.approval ? s.approval.summary : s.activity || s.notice || s.status;
    $("message").textContent = s.lastMessage || "";
    $("approval").style.display = s.status === "needs-you" && s.approval ? "flex" : "none";
    const sel = $("threads");
    sel.replaceChildren(...(s.threads || []).map((t) => Object.assign(document.createElement("option"), { value: t.id, textContent: t.title, selected: s.thread && t.id === s.thread.id })));
  }
  const send = (m) => ws.readyState === 1 && ws.send(JSON.stringify(m));
  $("say").onsubmit = (e) => { e.preventDefault(); send({ type: "say", text: $("text").value }); $("text").value = ""; };
  $("threads").onchange = (e) => send({ type: "selectThread", id: e.target.value });
  document.querySelectorAll("[data-cmd]").forEach((b) => (b.onclick = () => send({ type: b.dataset.cmd })));
  connect();
</script>
